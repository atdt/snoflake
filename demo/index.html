<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snoflake Demo</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="shell">
        <header>
            <div>
                <h1>ELIZA on Snoflake</h1>
                <p>A browser-hosted SNOBOL4 macro implementation running the modernized ELIZA program.</p>
            </div>
            <div class="actions">
                <button id="run" type="button">Restart</button>
                <button id="reset" class="secondary" type="button">Reset</button>
            </div>
        </header>

        <section class="workspace" aria-label="Snoflake browser demo">
            <div class="pane">
                <div class="pane-header">Source</div>
                <textarea id="source" spellcheck="false" aria-label="SNOBOL source"></textarea>
            </div>
            <div class="pane conversation-pane">
                <div class="pane-header">
                    <span>Conversation</span>
                    <span id="status" class="status">Ready</span>
                </div>
                <div id="output" class="terminal" role="log" aria-live="polite"></div>
                <form id="input-form" class="prompt">
                    <span aria-hidden="true">&gt;</span>
                    <input id="input-line" type="text" autocomplete="off" spellcheck="false" aria-label="Interactive input">
                    <button id="send" type="submit">Send</button>
                    <button id="eof" class="secondary" type="button">EOF</button>
                </form>
            </div>
        </section>
    </main>
    <script type="module" src="./main.js"></script>
</body>
</html>
