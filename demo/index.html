<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snoflake Demo</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="shell">
        <header>
            <div>
                <h1>Snoflake Demo</h1>
                <p><a href="https://github.com/atdt/snoflake">Snoflake</a> is a browser-hosted SNOBOL4 macro implementation. Try it out.</p>
            </div>
        </header>

        <section id="eliza-example" class="example" aria-labelledby="eliza-title">
            <div class="example-header">
                <div>
                    <h2 id="eliza-title">Interactive I/O</h2>
                </div>
                <div class="actions">
                    <button id="eliza-restart" type="button">Restart</button>
                    <button id="eliza-reset" class="secondary" type="button">Reset</button>
                    <span id="eliza-status" class="status">Ready</span>
                </div>
            </div>

            <div class="workspace workspace-interactive" aria-label="Interactive SNOBOL demo">
                <div class="pane">
                    <div class="pane-header">Source</div>
                    <textarea id="eliza-source" spellcheck="false" aria-label="ELIZA SNOBOL source"></textarea>
                </div>
                <div class="pane conversation-pane">
                    <div class="pane-header">Interactive I/O</div>
                    <div id="eliza-conversation" class="terminal" role="log" aria-label="Interactive output" aria-live="polite"></div>
                    <form id="eliza-input-form" class="prompt">
                        <span aria-hidden="true">&gt;</span>
                        <input id="eliza-input-line" type="text" autocomplete="off" spellcheck="false" aria-label="Interactive input">
                        <button id="eliza-send" type="submit">Send</button>
                        <button id="eliza-eof" class="secondary" type="button">EOF</button>
                    </form>
                </div>
            </div>
        </section>

        <section id="pattern-example" class="example" aria-labelledby="pattern-title">
            <div class="example-header">
                <div>
                    <h2 id="pattern-title">Batch I/O</h2>
                </div>
                <div class="actions">
                    <button id="pattern-run" type="button">Run</button>
                    <button id="pattern-reset" class="secondary" type="button">Reset</button>
                    <span id="pattern-status" class="status">Ready</span>
                </div>
            </div>

            <div class="workspace workspace-batch" aria-label="Batch I/O demo">
                <div class="pane">
                    <div class="pane-header">Source</div>
                    <textarea id="pattern-source" spellcheck="false" aria-label="Batch SNOBOL source"></textarea>
                </div>
                <div class="pane input-pane">
                    <div class="pane-header">Input</div>
                    <textarea id="pattern-input" spellcheck="false" aria-label="Batch input"></textarea>
                </div>
                <div class="pane">
                    <div class="pane-header">Output</div>
                    <pre id="pattern-output" aria-live="polite"></pre>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="./main.js"></script>
</body>
</html>
