<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snoflake</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: light-dark(#fdfdfc, #16191d);
        --panel: light-dark(#f2f4f3, #1f242a);
        --border: light-dark(#dde1e0, #343b42);
        --fg: light-dark(#1f252b, #dce3e0);
        --muted: light-dark(#68726f, #8d989c);
        --accent: light-dark(#116466, #4fc3c3);
        --error: light-dark(#b3372a, #ff7a6e);
        --literal: light-dark(#8a5114, #d2a86c);
        --builtin: light-dark(#0f5c8c, #7fb5dd);
        --selection: light-dark(#cde4e4, #1e4040);
        --terminal-bg: #0c120e;
        --terminal-fg: #52df6e;
        --active-line: light-dark(
            rgba(0, 0, 0, 0.04),
            rgba(255, 255, 255, 0.05)
        );
    }

    :root[data-theme='light'] {
        color-scheme: light;
    }
    :root[data-theme='dark'] {
        color-scheme: dark;
    }

    * {
        box-sizing: border-box;
    }

    html {
        /* 62.5% of the browser default 16px, so 1rem = 10px. */
        font-size: 62.5%;
    }

    body {
        height: 100dvh;
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--fg);
        font: 1.2rem/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }

    header {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
    }

    h1 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 600;
        text-transform: uppercase;
    }

    h1::before {
        content: '\2744\FE0E  ';
    }

    h1 a {
        color: var(--accent);
        text-decoration: none;
    }

    h1 a:hover {
        text-decoration: underline;
    }

    #status {
        flex: 1;
        color: var(--muted);
        font-size: 1.2rem;
        text-transform: uppercase;
    }

    #status.error {
        color: var(--error);
    }

    select {
        padding: 3px 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
        font-size: 1.2rem;
    }

    select:hover {
        border-color: var(--accent);
    }

    #run {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 12px;
        border: 1px solid var(--accent);
        border-radius: 4px;
        background: var(--accent);
        color: var(--bg);
        font: inherit;
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        cursor: pointer;
    }

    #run::before {
        /* A small play triangle. */
        content: '\25B6';
        font-size: 0.9em;
    }

    #run:hover {
        filter: brightness(1.1);
    }

    #run:active {
        filter: brightness(0.9);
    }

    .toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 1.2rem;
        text-transform: uppercase;
        cursor: pointer;
    }

    main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1.1fr 0.55fr 0.8fr;
    }

    main.input-hidden {
        grid-template-columns: 1.1fr 0.8fr;
    }

    main.input-hidden #input-section {
        display: none;
    }

    section {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }

    section + section {
        border-left: 1px solid var(--border);
    }

    h2 {
        margin: 0;
        padding: 4px 12px;
        background: var(--panel);
        color: var(--muted);
        font-size: 1.1rem;
        font-weight: 400;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    /* The left column is a single tabbed pane: one tab per source file
       (the program plus any -INCLUDE files), with one editor shown at a
       time. */
    .tabbar {
        display: flex;
        align-items: stretch;
        background: var(--panel);
        font-size: 1.1rem;
        letter-spacing: 0.06em;
    }

    .tabs {
        flex: 1;
        min-width: 0;
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
        display: none;
    }

    .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        /* Shrink to share the bar; an overflowing label is ellipsized.
           Tabs stop shrinking at min-width, then the row scrolls. */
        flex: 0 1 auto;
        min-width: 5ch;
        padding: 4px 10px;
        border-right: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
    }

    .tab.active {
        background: var(--bg);
        color: var(--fg);
    }

    .tab .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .tab .close {
        flex: none;
        padding: 0;
        border: none;
        background: none;
        color: var(--muted);
        font: inherit;
        line-height: 1;
        cursor: pointer;
    }

    .tab .close:hover {
        color: var(--error);
    }

    .tab input {
        width: 10ch;
        padding: 0;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
        outline: none;
    }

    /* The add button sits outside the scrolling tab row, so it stays
       visible no matter how many tabs there are. */
    #add-file {
        flex: none;
        padding: 4px 12px;
        border: none;
        border-right: 1px solid var(--border);
        background: none;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
    }

    #add-file:hover {
        color: var(--accent);
    }

    /* One editor serves every file; switching tabs swaps its state. */
    #editor-stack {
        flex: 1;
        min-height: 0;
    }

    #editor-stack > .cm-editor {
        height: 100%;
    }

    .cm-editor.cm-focused {
        outline: none;
    }

    #input,
    #out {
        flex: 1;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        font: inherit;
    }

    #input {
        border: none;
        background: var(--bg);
        color: var(--fg);
        resize: none;
    }

    #input:focus {
        outline: none;
    }

    /* The output pane is a phosphor terminal: green on near-black, a
       soft glow, and faint scanlines. */
    #out {
        background-color: var(--terminal-bg);
        background-image: repeating-linear-gradient(
            transparent 0 2px,
            rgba(0, 0, 0, 0.25) 2px 3px
        );
        color: var(--terminal-fg);
        text-shadow: 0 0 6px rgba(82, 223, 110, 0.4);
    }

    #out::selection {
        background: rgba(82, 223, 110, 0.3);
    }

    @media (max-width: 720px) {
        main {
            grid-template-columns: 1fr;
            grid-template-rows: 2fr 1fr 2fr;
        }

        main.input-hidden {
            grid-template-columns: 1fr;
            grid-template-rows: 2fr 2fr;
        }

        section + section {
            border-left: none;
            border-top: 1px solid var(--border);
        }
    }
</style>

<header>
    <h1>
        <a href="https://github.com/atdt/snoflake">Snoflake</a>
    </h1>
    <select id="example" aria-label="Load example"></select>
    <button id="run" type="button" title="Run (Ctrl/Cmd+Enter)">Run</button>
    <span id="status">Ready</span>
    <label class="toggle">
        <input type="checkbox" id="show-input" checked>
        Input
    </label>
    <select id="theme" aria-label="Color theme">
        <option value="auto">auto</option>
        <option value="light">light</option>
        <option value="dark">dark</option>
    </select>
</header>
<main>
    <section id="sources">
        <div class="tabbar">
            <div class="tabs" id="file-tabs"></div>
            <button id="add-file" type="button" title="Add a source file">
                +
            </button>
        </div>
        <div id="editor-stack"></div>
    </section>
    <section id="input-section">
        <h2>Input</h2>
        <textarea
            id="input"
            spellcheck="false"
            aria-label="Program input"
        ></textarea>
    </section>
    <section>
        <h2>Output</h2>
        <pre id="out"></pre>
    </section>
</main>

<script type="module">
    import { basicSetup, EditorView } from 'https://esm.sh/codemirror';
    import { EditorState } from 'https://esm.sh/@codemirror/state';
    import {
        HighlightStyle,
        syntaxHighlighting,
    } from 'https://esm.sh/@codemirror/language';
    import { tags } from 'https://esm.sh/@lezer/highlight';
    import { snobol } from 'https://esm.sh/codemirror-lang-snobol';

    const EXAMPLES = {
        'Pattern matching': {
            source: `READ    LINE = INPUT :F(END)
        LINE ('GOLD' | 'BLUE') . SHADE ('FISH' | 'BIRD') . KIND :F(READ)
        OUTPUT = SHADE ' ' KIND :(READ)
END`,
            input: 'GOLDFISH\nBLUEBIRD\nSNOWBIRD\nGOLDFINCH\nBLUEFISH\n',
        },
        'Swap': {
            source: `        WORD = 'SNOBOL'
        WORD LEN(3) . HEAD REM . TAIL
        OUTPUT = TAIL HEAD
END`,
            input: '',
        },
        'Fibonacci': {
            source: `        A = 0
        B = 1
LOOP    OUTPUT = B
        T = A + B
        A = B
        B = LT(B, 100) T :S(LOOP)
END`,
            input: '',
        },
        'Word tally': {
            source: `        COUNT = TABLE()
LINE    TEXT = INPUT :F(DONE)
NEXT    TEXT BREAK(' ') . WORD SPAN(' ') = :F(LAST)
        COUNT<WORD> = COUNT<WORD> + 1 :(NEXT)
LAST    COUNT<TEXT> = DIFFER(TEXT) COUNT<TEXT> + 1 :(LINE)
DONE    RESULT = CONVERT(COUNT, 'ARRAY')
        I = 0
PRINT   I = I + 1
        OUTPUT = RESULT<I,1> ': ' RESULT<I,2> :S(PRINT)
END`,
            input: 'TO BE OR NOT TO BE\nTHAT IS THE QUESTION\n\nTO BE\n',
        },
        'Random story': {
            source: `-INCLUDE "RSENTENC.INC"
	RAN_VAR = TIMESTAMP()
	ACTIONS = TABLE()
	BB = BREAK(' ')
	SB = SPAN(' ')
READ_PHRASE
	X = TRIM(INPUT)                     :F(BEGIN_STORY)
	IDENT(X,'END')                      :S(BEGIN_STORY)
	X (BB SB BB) . SUBJ_VERB SB REM . OBJS
	OBJS = OBJS '|'
READ_PH1
	OBJS POS(0) '<' ARB . VAR '>' = RSENT_TBL<VAR>
	OBJS POS(0) '|' =                   :S(READ_PH1)
	OBJS BREAK('|') . OBJ '|' =         :F(READ_PHRASE)
	ACTIONS<OBJ> = ACTIONS<OBJ> '|' SUBJ_VERB
	                                    :(READ_PH1)
BEGIN_STORY	RSTORY = RSENTENCE('<OPENING>')
	LIST = PET " won't jump over the " BARRIER
	LAST = PET
	&MAXLNGTH = 30000
NEW_AGENT
	TRY = 0
RETRY	TRY = TRY + 1 LT(TRY,10)            :F(REQUEST)
	ALTS = ACTIONS<LAST>
	RSENTENCE(RSELECT(ALTS)) BB . SUBJ SB REM . VERB
	RSTORY ' ' SUBJ ' '                 :S(RETRY)
	RSTORY ' ' VERB ' '                 :S(RETRY)
REQUEST	RSTORY = RSTORY RSENTENCE('<REFUSAL>')
	LIST = SUBJ " won't " VERB ' the ' LAST ", " LIST
	LAST = SUBJ
	LT(SIZE(LIST), 175)                 :S(NEW_AGENT)
FIN1	LIST "won't" = "began to"           :S(FIN1)
FIN2	LIST ',' = "; the"                  :S(FIN2)
	RSTORY = RSTORY RSENTENCE('<PERSUADED>')
OUT	RSTORY (LEN(50) BB) . OUTPUT SB =   :S(OUT)
	OUTPUT = RSTORY
END`,
            input:
                `<OPENING>::=<TIME> there was a =CHAR= who went to <PLACE> and
 bought a =PET=.  On the way home they came upon a =BARRIER=
 which the (PET) was afraid to cross.  The (CHAR) said "(PET),
 (PET), jump over the (BARRIER) or I won't get home tonight."
<TIME>::=Once upon a time|Once|Long ago in a small village|
In days gone by in a little town by the river
<PLACE>::=market|a pet store|a super market|town|the city
<BARRIER>::=fence|ditch|fallen tree|large rock|stream|brook
<PET>::=dog|cat|parrot|pony
<REFUSAL>::= But the (LAST) would not.  The (CHAR)
 <EXCURSION> and she met a (SUBJ).  She said, "(SUBJ), (SUBJ),
 (VERB) (LAST), (LIST) and I shan't get home tonight."
<EXCURSION>::=went down the path|went over a hill|went by
 <OBJECT> and then <EXCURSION>|went toward <OBJECT>|
went over hill and dale|went near <OBJECT>|went on the road to
 <OBJECT>|went for (RANDOM(20) + 1) miles
<OBJECT>::=the <COLOR> <THING>
<COLOR>::=white|blue|red|yellow|grey|black|dark|green|orange
<THING>::=mill|tavern|church|school|house|meadow|rock|barn
<PERSUADED>::= The (SUBJ) knew the (CHAR) and, in fact,
 had been saved by her from a wild <WILD_AN>.  So the (LIST)
 and the (CHAR) got home that night.
<CHAR>::=little old woman|little old lady|kind grandmother|
kind old aunt|little girl dressed in red|retired seamstress|
nice old lady|little girl green
<DOM_AN>::=cow|pig|horse|sheep|chicken
<WILD_AN>::=lion|giraffe|tiger|camel|ostrich|rhinoceros
<ANIMAL>::=<DOM_AN>|<WILD_AN>|<PET>
<HUMAN>::=farmer|girl|policeman|hunter|man|boy
<A>::=<HUMAN>|<ANIMAL>
<CUT>::=cut|slice|snip|slash
<CUTTER>::=knife|scissor|sword|dagger
<BEE>::=bee|wasp|horse-fly
<HURT>::=bite|frighten|scare|kick|eat
END
<ANIMAL> <HURT> <HUMAN>
<CUTTER> <CUT> <A>
<A> break <CUTTER>
water drown <A>
<A> drink water
fire burn <A>
smoke suffocate <A>
<BEE> sting <A>
<A> swat <BEE>
wind blow-out fire
wind disperse smoke
smoke pollute wind
smoke smother fire
<HUMAN> disperse smoke
<A> spill liquor
liquor intoxicate <A>
<HUMAN> slay <WILD_AN>
<WILD_AN> eat <HUMAN>
END
`,
            files: {
                'RSENTENC.INC': `-MODULE RSENTENCE
-INCLUDE "BAL.INC"
-INCLUDE "RSELECT.INC"
	DEFINE('RSENTENCE(STACK)VAR,EXP,S,TEXT')
	SYN.VAR = POS(0) '<' ARB . VAR '>'
	SNOBAL.EXP = POS(0) '(' BAL('(<>)','"' "'") . EXP ')'
	ASGN.VAR = POS(0) '=' ARB . VAR '='
	LITERAL.TEXT = BREAK('<=(') . TEXT
	RSENT_TBL = TABLE()
	SS = TRIM(INPUT)
RSI_1	S = TRIM(INPUT)
	S POS(0) ('<' | 'END' RPOS(0))              :S(RSI_2)
	SS = SS S                                   :(RSI_1)
RSI_2	SS '<' ARB . NM '>::=' =
	RSENT_TBL<NM> = '|' SS
	IDENT(S,'END')                              :S(RSENTENCE_END)
	SS = S                                      :(RSI_1)

RSENTENCE
	STACK SYN.VAR = RSELECT(RSENT_TBL<VAR>)     :S(RSENTENCE)
	STACK SNOBAL.EXP =                          :F(RSENT_1)
	S = S EVAL(EXP)                             :(RSENTENCE)
RSENT_1	STACK ASGN.VAR =                            :F(RSENT_2)
	$VAR = RSENTENCE('<' VAR '>')
	S = S $VAR                                  :(RSENTENCE)
RSENT_2	STACK LITERAL.TEXT =                        :F(RSENT_3)
	S = S TEXT                                  :(RSENTENCE)
RSENT_3	RSENTENCE = S STACK                         :(RETURN)
RSENTENCE_END`,
                'BAL.INC': `	DEFINE('BAL(PARENS,QTS)Q,GBAL,NAME,STAR,LP,RP')
	                                                    :(BAL_END)
BAL	NAME = 'BAL_.' &STCOUNT
	STAR = CONVERT(NAME, 'EXPRESSION')
	GBAL = NOTANY(PARENS QTS)
BAL_1	QTS LEN(1) . Q =                                    :F(BAL_2)
	GBAL = Q BREAK(Q) Q | GBAL                          :(BAL_1)
BAL_2	PARENS LEN(1) . LP RTAB(1) . PARENS LEN(1) . RP     :F(BAL_3)
	GBAL = LP (STAR | NULL) RP | GBAL                   :(BAL_2)
BAL_3	BAL = GBAL ARBNO(GBAL)
	$NAME = BAL                                         :(RETURN)
BAL_END`,
                'RSELECT.INC':
                    `* RSELECT.inc - RSELECT(S) will make a random selection of one of
*		a sequence of strings passed to it as an argument.
*		The first character in S is taken to be a break
*		character separating strings in the sequence.
*
*	RSELECT('|A|BIG|CAT') will return either "A", "BIG", or
*	"CAT" with probability one-third.  An optional integer
*	weight enclosed in sharp signs (#) may be placed at the
*	beginning of any alternation.  Thus:
*
*	RSELECT('|A|#3#BIG|CAT') will return "BIG" 3 times out
*	of five.
*
-INCLUDE "QUOTE.INC"
-INCLUDE "RANDOM.INC"
	DEFINE('RSELECT(S)WT,WTS,ALT,CODE,I,CODE,SSAVED,BC')
	RSEL_TBL = TABLE()              :(RSELECT_END)
RSELECT	CODE = RSEL_TBL<S>
	DIFFER(CODE,NULL)               :S<CODE>
	SSAVED = S
	S LEN(1) . BC =                 :F(RETURN)
RSELECT_1
	WT = 1
	S POS(0) '#' BREAK('#') . WT '#' =
	S (BREAK(BC) | REM) . ALT =
	WTS = WTS + WT
	CODE = CODE ' ;  RSELECT = LE(I,' WTS ') '
+	QUOTE(ALT) '				:S(RETURN)'
	S BC =                          :S(RSELECT_1)
	CODE = '  I = RANDOM(' WTS ') ' CODE
	S = SSAVED
	RSEL_TBL<S> = CODE(CODE)        :S(RSELECT)F(ERROR)
RSELECT_END`,
                'QUOTE.INC':
                    `* QUOTE.inc - QUOTE(S) will convert its argument to a string
*	      which will resemble a SNOBOL4 expression which,
*	      when evaluated, will yield the original string S.
*
-INCLUDE "REPL.INC"
	DEFINE('QUOTE(S)S1,Q,QQ')                       :(QUOTE_END)
QUOTE	Q = "'" ; QQ = '"'
	QUOTE = Q REPL(S, Q, Q ' ' QQ Q QQ ' ' Q) Q     :(RETURN)
QUOTE_END
`,
                'REPL.INC':
                    `* REPL.inc - REPL(S1,S2,S3) will do a string-by-string replacement
*	     (as opposed to a character-by-character replacement
*	     ala REPLACE) on the string S1.  The string S1 is scanned
*	     for instances of the string S2  and each is replaced by
*	     S3.  Portions of S1 already scanned and the replaced
*	     string are not reexamined for instances of S2.
*
-INCLUDE "BREAKX.INC"
	DEFINE('REPL(S1,S2,S3)C,T,FINDC')   :(REPL_END)
REPL	S2 LEN(1) . C =                     :F(FRETURN)
	FINDC = BREAK(C) . T LEN(1)
	S2 = POS(0) S2
REPL_1	S1 FINDC =                          :F(REPL_2)
	S1 S2 =                             :F(REPL_3)
	REPL = REPL T S3                    :(REPL_1)
REPL_3	REPL = REPL T C                     :(REPL_1)
REPL_2	REPL = REPL S1                      :(RETURN)
REPL_END`,
                'BREAKX.INC':
                    `* BREAKX.inc - BREAKX(S) will return a pattern that will
*	       extend itself to include characters from S
*	       if required by a rematch attempt.
*	       
*  Built-in function in SNOBOL4+ and SPITBOL.
*
	DEFINE('BREAKX(S)')             :(BREAKX_END)
BREAKX	BREAKX = BREAK(S) ARBNO(LEN(1) BREAK(S))
	                                :(RETURN)
BREAKX_END
`,
                'RANDOM.INC': `	DEFINE('RANDOM(N)')
	RAN_VAR = 1                     :(RANDOM_END)
RANDOM
	RAN_VAR = REMDR(RAN_VAR * 4676, 414971)
	RANDOM = RAN_VAR / 414971.
	RANDOM = NE(N,0) CONVERT(RANDOM * N,'INTEGER') + 1
	                                :(RETURN)
RANDOM_END`,
            },
        },
    };

    const DEFAULT_EXAMPLE = 'Pattern matching';

    const statusEl = document.querySelector( '#status' ),
        mainEl = document.querySelector( 'main' ),
        input = document.querySelector( '#input' ),
        out = document.querySelector( '#out' ),
        exampleSel = document.querySelector( '#example' ),
        themeSel = document.querySelector( '#theme' ),
        showInputEl = document.querySelector( '#show-input' ),
        runBtn = document.querySelector( '#run' ),
        fileTabs = document.querySelector( '#file-tabs' ),
        editorStack = document.querySelector( '#editor-stack' ),
        addFileBtn = document.querySelector( '#add-file' );

    let runningTimer;

    function setStatus( message, error = false ) {
        clearTimeout( runningTimer );
        statusEl.textContent = message;
        statusEl.classList.toggle( 'error', error );
    }

    // Theme tokens are CSS variables resolved with light-dark(), so switching
    // themes is just a color-scheme change; the editor needs no reconfiguring.
    const THEME_KEY = 'snoflake-theme';

    function applyTheme( theme ) {
        if ( theme === 'auto' ) {
            delete document.documentElement.dataset.theme;
        } else {
            document.documentElement.dataset.theme = theme;
        }
        themeSel.value = theme;
        localStorage.setItem( THEME_KEY, theme );
    }

    themeSel.addEventListener( 'change', () => applyTheme( themeSel.value ) );
    applyTheme( localStorage.getItem( THEME_KEY ) || 'auto' );

    const editorTheme = EditorView.theme( {
        '&': { backgroundColor: 'var(--bg)', color: 'var(--fg)' },
        '.cm-gutters': {
            backgroundColor: 'var(--panel)',
            color: 'var(--muted)',
            border: 'none',
        },
        '.cm-activeLine': { backgroundColor: 'var(--active-line)' },
        '.cm-activeLineGutter': { backgroundColor: 'var(--active-line)' },
        '.cm-content': { caretColor: 'var(--accent)' },
        '.cm-cursor, .cm-dropCursor': { borderLeftColor: 'var(--accent)' },
        '&.cm-focused .cm-selectionBackground, .cm-selectionBackground, .cm-content ::selection':
            { backgroundColor: 'var(--selection)' },
    } );

    const highlight = HighlightStyle.define( [
        { tag: tags.lineComment, color: 'var(--muted)', fontStyle: 'italic' },
        { tag: tags.meta, color: 'var(--muted)' },
        { tag: tags.labelName, color: 'var(--accent)', fontWeight: '600' },
        { tag: tags.controlKeyword, color: 'var(--accent)' },
        { tag: tags.keyword, color: 'var(--accent)' },
        { tag: tags.standard( tags.variableName ), color: 'var(--builtin)' },
        { tag: tags.string, color: 'var(--literal)' },
        { tag: tags.special( tags.string ), color: 'var(--literal)' },
        { tag: tags.number, color: 'var(--literal)' },
    ] );

    // The interpreter runs in a worker so the page stays responsive. The
    // page is a single file, so the worker module is inlined via a blob URL.
    // It posts 'ready' once the runtime has imported, so the host can hold
    // the first run until then. The input pane is served as the program's
    // input file, so INPUT reads it line by line. The extra file panes are
    // served by pane name, so -INCLUDE and INPUT()/OUTPUT() redirects reach
    // them.
    const WORKER_SOURCE = `
        import * as SNOBOL from 'https://esm.sh/snoflake';

        self.postMessage( { type: 'ready' } );

        self.onmessage = ( event ) => {
            const { source, input, files } = event.data,
                write = ( line ) => self.postMessage( { type: 'line', line } );

            try {
                SNOBOL.run( {
                    source,
                    input: 'input.txt',
                    loader: {
                        load( path ) {
                            if ( path === 'input.txt' ) return input;
                            if ( Object.hasOwn( files, path ) ) {
                                return files[path];
                            }
                            throw new Error( 'No such file: ' + path );
                        },
                        loadInclude( path ) {
                            return Object.hasOwn( files, path )
                                ? { path, content: files[path] }
                                : null;
                        },
                    },
                    // A host-provided builtin: Date.now() is epoch time, so
                    // programs can seed an RNG with TIMESTAMP() and vary each
                    // run. Registered extensions are LOADed for every program.
                    extensions: {
                        'TIMESTAMP()INTEGER': () => Date.now(),
                    },
                    stdout: { write },
                    stderr: { write },
                } );
                self.postMessage( { type: 'done' } );
            } catch ( e ) {
                self.postMessage( {
                    type: 'error',
                    message: String( e?.message || e ),
                } );
            }
        };
    `;

    const workerUrl = URL.createObjectURL(
        new Blob( [ WORKER_SOURCE ], { type: 'text/javascript' } ),
    );

    function write( line ) {
        out.textContent += line + '\n';
    }

    // A single worker is kept warm and reused across runs. Spawning one per
    // run re-imports the runtime each time, and that startup cost lands right
    // around the 100ms threshold below, so the status would flicker between
    // 'Running…' and 'Ready' from boot latency alone. run() makes a fresh VM
    // per message, so reuse is safe.
    let worker, busy = false, onWarm = null;

    function spawnWorker() {
        worker = new Worker( workerUrl, { type: 'module' } );
        worker.onmessage = ( event ) => {
            const message = event.data;
            if ( message.type === 'ready' ) {
                onWarm?.();
                onWarm = null;
            } else if ( message.type === 'line' ) {
                write( message.line );
            } else if ( message.type === 'done' ) {
                busy = false;
                setStatus( 'Ready' );
            } else {
                busy = false;
                setStatus( `Error: ${message.message}`, true );
            }
        };
        worker.onerror = ( event ) => {
            busy = false;
            setStatus( `Error: ${event.message}`, true );
        };
    }

    function run() {
        // Reuse the warm worker; only a still-running program needs killing,
        // which means dropping its worker and booting a fresh one.
        if ( busy ) {
            worker.terminate();
            spawnWorker();
        }
        busy = true;
        out.textContent = '';

        // A genuinely slow program shows 'Running…'; fast ones finish before
        // the timer fires, so the status never changes.
        clearTimeout( runningTimer );
        runningTimer = setTimeout( () => setStatus( 'Running…' ), 200 );

        // files[0] is the program; the rest are named -INCLUDE/INPUT files.
        // The active file's edits live in the view, so fold them back first.
        syncActive();
        const fileMap = {};
        for ( const file of files.slice( 1 ) ) {
            fileMap[file.name] = file.state.doc.toString();
        }

        worker.postMessage( {
            source: files[0].state.doc.toString(),
            input: input.value,
            files: fileMap,
        } );
    }

    spawnWorker();

    const extensions = [
        basicSetup,
        snobol(),
        editorTheme,
        syntaxHighlighting( highlight ),
    ];

    // One editor backs every file. Each file keeps its own EditorState (so
    // its text, cursor, and undo history survive tab switches); switching
    // saves the live state back to the outgoing file and loads the next.
    // files[0] is the program (fixed: not renamable or removable); the rest
    // are the named files served to the loader.
    const view = new EditorView( { parent: editorStack } );

    let files = [],
        activeFile = 0;

    const fileState = ( content ) =>
        EditorState.create( { doc: content, extensions } );

    function syncActive() {
        if ( files[activeFile] ) {
            files[activeFile].state = view.state;
        }
    }

    function renderTabs() {
        fileTabs.replaceChildren();
        files.forEach( ( file, i ) => {
            const active = i === activeFile,
                tab = document.createElement( 'span' ),
                name = document.createElement( 'span' );
            tab.className = active ? 'tab active' : 'tab';
            name.className = 'name';
            name.textContent = file.name;
            name.title = file.name;
            tab.append( name );

            tab.addEventListener( 'click', () => {
                if ( i !== activeFile ) {
                    selectFile( i );
                } else if ( !file.fixed ) {
                    renameFile( name, file );
                }
            } );

            if ( !file.fixed ) {
                const close = document.createElement( 'button' );
                close.className = 'close';
                close.type = 'button';
                close.title = 'Remove file';
                close.textContent = '×';
                close.addEventListener( 'click', ( event ) => {
                    event.stopPropagation();
                    removeFile( i );
                } );
                tab.append( close );
            }
            fileTabs.append( tab );
        } );
    }

    function selectFile( i ) {
        syncActive();
        activeFile = i;
        view.setState( files[i].state );
        renderTabs();
        view.focus();
    }

    function renameFile( nameEl, file ) {
        const nameInput = document.createElement( 'input' );
        nameInput.value = file.name;
        nameInput.setAttribute( 'aria-label', 'File name' );
        nameEl.replaceChildren( nameInput );
        nameInput.focus();
        nameInput.select();
        nameInput.addEventListener( 'click', ( e ) => e.stopPropagation() );
        nameInput.addEventListener( 'blur', () => {
            const name = nameInput.value.trim();
            if (
                name && name !== file.name &&
                !files.some( ( f ) => f.name === name )
            ) {
                file.name = name;
            }
            renderTabs();
        } );
        nameInput.addEventListener( 'keydown', ( event ) => {
            if ( event.key === 'Escape' ) {
                nameInput.value = file.name;
            }
            if ( event.key === 'Enter' || event.key === 'Escape' ) {
                nameInput.blur();
            }
        } );
    }

    function addFile( name, content = '' ) {
        files.push( { name, state: fileState( content ) } );
        selectFile( files.length - 1 );
    }

    function removeFile( i ) {
        syncActive();
        files.splice( i, 1 );
        activeFile = activeFile > i
            ? activeFile - 1
            : Math.min( activeFile, files.length - 1 );
        view.setState( files[activeFile].state );
        renderTabs();
    }

    addFileBtn.addEventListener( 'click', () => {
        let n = files.length;
        let name;
        do {
            name = `FILE${n}.INC`;
            n++;
        } while ( files.some( ( f ) => f.name === name ) );
        addFile( name );
    } );

    runBtn.addEventListener( 'click', run );

    // Ctrl/Cmd+Enter runs from anywhere, including inside the editor.
    addEventListener( 'keydown', ( event ) => {
        if ( ( event.metaKey || event.ctrlKey ) && event.key === 'Enter' ) {
            event.preventDefault();
            run();
        }
    } );

    showInputEl.addEventListener( 'change', () => {
        mainEl.classList.toggle( 'input-hidden', !showInputEl.checked );
    } );

    function loadExample( example ) {
        files = [
            {
                name: 'Program',
                state: fileState( example.source ),
                fixed: true,
            },
            ...Object.entries( example.files ?? {} ).map(
                ( [ name, content ] ) => ( {
                    name,
                    state: fileState( content ),
                } ),
            ),
        ];
        activeFile = 0;
        view.setState( files[0].state );
        renderTabs();
        input.value = example.input;
    }

    for ( const name of Object.keys( EXAMPLES ) ) {
        exampleSel.add( new Option( name ) );
    }

    // Selecting a whole program is a deliberate action, so show its output at
    // once; edits afterward wait for the Run button.
    exampleSel.addEventListener( 'change', () => {
        loadExample( EXAMPLES[exampleSel.value] );
        run();
    } );

    loadExample( EXAMPLES[DEFAULT_EXAMPLE] );
    // Hold the first run until the worker has imported the runtime, so the
    // status doesn't flash 'Running…' during startup.
    onWarm = run;
</script>
